server.port = ${SERVER_PORT:8443}
server.ssl.key-store = classpath:keystore.jks
server.ssl.key-store-password = ${SERVER_SSL_KEY_STORE_PASSWORD:password}
server.ssl.key-password = ${SERVER_SSL_KEY_PASSWORD:secret}

spring.mustache.suffix=.html

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/stilnovo?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:create}

# Necessary to be able to use accents and the letter ñ
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true

# Multipart configuration for large file uploads
# Max size for a single file
spring.servlet.multipart.max-file-size=10MB
# Max size for the entire request (including all files and form fields)
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true
spring.servlet.multipart.resolve-lazily=false

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Sets the maximum inactive interval before a session expires (e.g., 10 minutes)
# Supported units: s (seconds), m (minutes), h (hours)
#future implementation: server.servlet.session.timeout=10m

# Mail (configure with real SMTP credentials)
spring.mail.host=smtp.gmail.com
spring.mail.port=587

# 1. Import the local file if it exists (but don't fail if it doesn't)
spring.config.import=optional:ai-aplication-key.properties

spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.public-base-url=${APP_PUBLIC_BASE_URL:https://localhost:${SERVER_PORT:8443}}
