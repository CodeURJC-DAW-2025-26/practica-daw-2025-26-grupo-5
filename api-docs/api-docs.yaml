components:
  schemas:
    ValorationDTO:
      type: object
      description: Represents a product rating and review from a buyer
      properties:
        id:
          type: integer
          format: int64
          description: Unique valoration identifier
          example: 305
        stars:
          type: integer
          format: int32
          description: Rating given by the buyer (1-5 stars)
          example: 5
        comment:
          type: string
          description: Review comment from the buyer
          example: Product arrived in perfect condition and very fast. Recommended
            seller.
        buyerName:
          type: string
          description: Name of the buyer who provided the rating
          example: Carlos Garcia
        transactionId:
          type: integer
          format: int64
          description: ID of the transaction this rating is for
          example: 1001
    UserDTO:
      type: object
      description: Represents a user account with public profile and authentication
        role information
      properties:
        id:
          type: integer
          format: int64
          description: Unique user identifier
          example: 5
        name:
          type: string
          description: User's display name
          example: Laura Martinez
        email:
          type: string
          description: User's email address
          example: laura.martinez@example.com
        rating:
          type: number
          format: double
          description: Average rating received by the user as a seller
          example: 4.8
        numRatings:
          type: integer
          format: int32
          description: Total number of ratings received
          example: 34
        description:
          type: string
          description: User's profile description or biography
          example: Seller of vintage photography items.
        roles:
          type: array
          description: "List of assigned security roles (e.g., ROLE_USER, ROLE_ADMIN)"
          items:
            type: string
        banned:
          type: boolean
          description: Boolean indicating if the user account is banned
          example: false
    TransactionUpdateRequestDTO:
      type: object
      description: Request body for updating an existing transaction. Only the fields
        that are allowed to be modified should be included.
      properties:
        transactionStatus:
          type: string
          description: Current status of the transaction
          example: shipped
        rated:
          type: boolean
          description: Boolean indicating if the buyer has rated this transaction
          example: true
        stars:
          type: integer
          format: int32
          description: Rating given by the buyer (1-5 stars)
          example: 4
          maximum: 5
          minimum: 1
      required:
      - transactionStatus
    ImageDTO:
      type: object
      description: Represents a product image reference in the system
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier for the image
          example: 101
    ProductDTO:
      type: object
      description: "Represents a product with its core details, seller information,\
        \ and user interactions"
      properties:
        id:
          type: integer
          format: int64
          description: Unique product identifier
          example: 1
        name:
          type: string
          description: Product name or title
          example: Mountain Bike
        category:
          type: string
          description: Product category classification
          example: Sports
        price:
          type: number
          format: double
          description: Current selling price of the product
          example: 120.5
        location:
          type: string
          description: Geographic location where the product is listed
          example: Madrid
        description:
          type: string
          description: Detailed product description
          example: "Mountain bike almost new, very little use."
        status:
          type: string
          description: "Product status (e.g., available, sold, inactive)"
          example: available
        image:
          $ref: "#/components/schemas/ImageDTO"
          description: Product image reference
        seller:
          $ref: "#/components/schemas/UserDTO"
          description: Information about the product seller
        userInteractions:
          type: array
          description: "List of user interactions (views, purchases, etc.) on this\
            \ product"
          items:
            $ref: "#/components/schemas/UserInteractionDTO"
    TransactionDTO:
      type: object
      description: Represents a completed transaction between seller and buyer
      properties:
        transactionId:
          type: integer
          format: int64
          description: Unique transaction identifier
          example: 1001
        finalPrice:
          type: number
          format: double
          description: Final amount paid for the transaction
          example: 150.75
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the transaction was created
          example: 2024-05-12T14:30:00
        formattedDate:
          type: string
          description: Human-readable formatted date of the transaction
          example: 12
        transactionStatus:
          type: string
          description: "Current status of the transaction (e.g., completed, pending\
            \ delivery)"
          example: completed
        rated:
          type: boolean
          description: Boolean indicating if the buyer has rated this transaction
          example: true
        stars:
          type: integer
          format: int32
          description: Rating given by the buyer (1-5 stars)
          example: 5
        seller:
          $ref: "#/components/schemas/UserDTO"
          description: Information about the seller in this transaction
        buyer:
          $ref: "#/components/schemas/UserDTO"
          description: Information about the buyer in this transaction
        product:
          $ref: "#/components/schemas/ProductDTO"
          description: The product that was sold in this transaction
    UserInteractionDTO:
      type: object
      description: "Represents a user interaction event with a product (view, purchase,\
        \ etc.)"
      properties:
        id:
          type: integer
          format: int64
          description: Unique interaction identifier
          example: 204
        userId:
          type: integer
          format: int64
          description: ID of the user who performed the interaction
          example: 12
        type:
          type: string
          description: "Type of interaction (e.g., VIEW, LIKE, BUY)"
          enum:
          - VIEW
          - LIKE
          - BUY
          example: VIEW
    ProductWriteRequestDTO:
      type: object
      description: Request body for creating or updating product listings with file
        upload capability
      properties:
        name:
          type: string
          description: Product name or title
          example: Laptop Computer
        category:
          type: string
          description: Product category classification
          example: Electronics
        price:
          type: number
          format: double
          description: Current selling price of the product
          example: 450.0
        location:
          type: string
          description: Geographic location where the product is listed
          example: Barcelona
        description:
          type: string
          description: Detailed product description
          example: Laptop with 16GB RAM and i7 processor.
        status:
          type: string
          description: "Product status (e.g., available, sold, inactive)"
          example: available
        file:
          type: string
          format: binary
          description: Product image file to be uploaded
    AdminUserUpdateRequestDTO:
      type: object
      description: Request body for administrators to update user account details
      properties:
        email:
          type: string
          description: Updated email address
          example: user.updated@example.com
        cardNumber:
          type: string
          description: Updated payment card number
          example: 1234567890123456
        cardCvv:
          type: string
          description: Updated card CVV security code
          example: 123
        cardExpiringDate:
          type: string
          description: Updated card expiration date
          example: 12/25
        description:
          type: string
          description: Updated user profile description
          example: Reliable buyer and seller since 2024.
    AdminProductUpdateRequestDTO:
      type: object
      description: Request body for administrators to update product details
      properties:
        name:
          type: string
          description: Updated product name
          example: Vintage Camera - Updated
        category:
          type: string
          description: Updated product category
          example: Photography
        price:
          type: number
          format: double
          description: Updated product price
          example: 135.0
        description:
          type: string
          description: Updated product description
          example: Price reduced! Classic 35mm film camera.
        location:
          type: string
          description: Updated product location
          example: Barcelona
        status:
          type: string
          description: Updated product status
          example: inactive
    SignupRequestDTO:
      type: object
      description: Request body for user account registration with profile picture
        upload
      properties:
        profilePicture:
          type: string
          format: binary
          description: User's profile picture image file
        username:
          type: string
          description: Desired username for the new account
          example: johndoe88
        email:
          type: string
          description: User's email address
          example: johndoe@example.com
        password:
          type: string
          description: Account password
          example: SecurePass123!
        confirmPassword:
          type: string
          description: Password confirmation for validation
          example: SecurePass123!
    TransactionCreateRequestDTO:
      type: object
      description: Request body for initiating a new transaction/purchase
      properties:
        productId:
          type: integer
          format: int64
          description: ID of the product being purchased
          example: 15
      required:
      - productId
    InquiryRequestDTO:
      type: object
      description: Request body for creating a new customer inquiry
      properties:
        productId:
          type: integer
          format: int64
          description: ID of the product being inquired about
          example: 12
        phone:
          type: string
