          type: integer
          format: int64
          description: Unique identifier for the inquiry
          example: 50
        productName:
          type: string
          description: Name of the product being inquired about
          example: Canon Reflex Camera
        sellerEmail:
          type: string
          description: Email address of the product seller
          example: seller@example.com
        buyerName:
          type: string
          description: Name of the customer making the inquiry
          example: Ana Lopez
        buyerEmail:
          type: string
          description: Email address of the customer
          example: ana.lopez@example.com
        buyerPhone:
          type: string
          description: Phone number of the customer
          example: "+34600123456"
        inquiryType:
          type: string
          description: Type or category of the inquiry
          example: Question about delivery
        message:
          type: string
          description: The inquiry message content
          example: Do you ship to the Canary Islands?
          maxLength: 1000
          minLength: 5
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the inquiry was created
          example: 2024-03-24T10:15:30
        status:
          type: string
          description: "Current status of the inquiry (e.g., pending, answered)"
          example: pending
        product:
          $ref: "#/components/schemas/ProductDTO"
          description: The product being inquired about
        buyer:
          $ref: "#/components/schemas/UserDTO"
          description: The customer making the inquiry
      required:
      - message
      - status
