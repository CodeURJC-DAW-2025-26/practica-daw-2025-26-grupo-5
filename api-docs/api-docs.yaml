openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: https://localhost:8443
  description: Generated server url
tags:
- name: Admin
  description: "REST API for administrative operations (users, products, transactions,\
    \ valorations)"
- name: Users
  description: REST API for user management and registration
- name: User Profiles
  description: "REST API for managing user profiles, settings, dashboard data, and\
    \ public seller profiles"
- name: Images
  description: REST API for image operations (retrieving and uploading product images)
- name: Transactions
  description: "REST API for managing purchases, sales, and checkout operations"
- name: Valorations
  description: REST API for managing user reviews and ratings (valorations) for transactions
- name: Products
  description: "REST API for catalog browsing, recommendations, and product management\
    \ (CRUD)"
- name: Authentication
  description: REST API for JWT Authentication
- name: Catalog
  description: "REST API for catalog and homepage operations (browsing, searching,\
    \ and filtering products)"
- name: PDF Export
  description: "REST API for generating and exporting PDF documents (invoices, shipping\
    \ labels, and statistics)"
- name: Inquiries
  description: REST API for buyer-to-seller inquiries
paths:
  /api/v1/valorations/{id}:
    get:
      tags:
      - Valorations
      summary: Get a valoration by ID
      description: Retrieves the details of a specific valoration by its unique identifier
      operationId: getValoration
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: Valoration not found
        "200":
          description: Valoration retrieved successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ValorationDTO"
    put:
      tags:
      - Valorations
      summary: Update a valoration
      description: Updates an existing valoration (stars and comment)
      operationId: updateValoration
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValorationDTO"
        required: true
      responses:
        "404":
          description: Valoration not found
        "200":
          description: Valoration updated successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ValorationDTO"
        "400":
          description: Invalid input data
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ValorationDTO"
        "401":
          description: Unauthorized user
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ValorationDTO"
        "403":
          description: Forbidden (not the author)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ValorationDTO"
    delete:
      tags:
      - Valorations
      summary: Delete a valoration
      description: Deletes a valoration by its ID. Only the author or an admin can
        delete it.
      operationId: deleteValoration
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: Valoration not found
        "204":
          description: Valoration deleted successfully
        "401":
          description: Unauthorized user
        "403":
          description: Forbidden (user is not the author nor an admin)
  /api/v1/users/me/profile-photo:
    get:
      tags:
      - User Profiles
      summary: Get my profile photo
      description: Retrieves the profile photo of the authenticated user
      operationId: getMyProfilePhoto
      responses:
        "404":
          description: Profile photo not found
        "200":
          description: Profile photo retrieved successfully
          content:
            image/png:
              schema:
                type: string
                format: binary
        "401":
          description: Unauthorized user
          content:
            image/png:
              schema:
                type: string
                format: binary
    put:
      tags:
      - User Profiles
      summary: Update my profile photo
      description: Uploads and updates the profile photo for the authenticated user
      operationId: updateMyProfilePhoto
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
              required:
              - image
      responses:
        "404":
          description: Not Found
        "200":
          description: Profile photo updated successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserDTO"
        "400":
          description: Invalid file or processing error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserDTO"
        "401":
          description: Unauthorized user
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserDTO"
    delete:
      tags:
      - User Profiles
      summary: Delete my profile photo
      description: "Deletes the profile photo of the authenticated user, restoring\
        \ the default avatar"
      operationId: deleteMyProfilePhoto
      responses:
        "404":
          description: Not Found
        "204":
          description: Profile photo deleted successfully
        "401":
          description: Unauthorized user
  /api/v1/transactions/{id}:
    get:
      tags:
      - Transactions
      summary: Get transaction details
      description: Retrieves the details of a specific transaction by its ID. Access
        is restricted to the buyer or seller.
      operationId: getTransaction
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: Transaction not found
        "200":
          description: Transaction details retrieved successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TransactionDTO"
        "401":
          description: Unauthorized user
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TransactionDTO"
        "403":
          description: Forbidden (user is not involved in this transaction)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TransactionDTO"
    put:
      tags:
      - Transactions
      summary: Update transaction
      description: Updates an existing transaction
      operationId: updateTransaction
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionUpdateRequestDTO"
        required: true
      responses:
        "404":
          description: Transaction not found
        "200":
          description: Transaction updated successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TransactionDTO"
        "400":
          description: Invalid input data
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TransactionDTO"
        "401":
          description: Unauthorized user
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TransactionDTO"
        "403":
          description: Forbidden (user lacks permissions to update)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TransactionDTO"
    delete:
      tags:
      - Transactions
      summary: Delete transaction
      description: Deletes a specific transaction by its ID
      operationId: deleteTransaction
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: Transaction not found
        "204":
          description: Transaction deleted successfully
        "401":
          description: Unauthorized user
        "403":
          description: Forbidden (user lacks permissions to delete)
  /api/v1/products/{id}:
    get:
      tags:
      - Products
      summary: Get product details
      description: Retrieves full product details including recommendations and tracks
        the visit
      operationId: getProductDetails
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: Product not found
        "200":
          description: Product details retrieved successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductDetailsDTO"
    put:
      tags:
      - Products
      summary: Update a product
      description: Performs a partial update on an existing product owned by the authenticated
        user
      operationId: updateProduct
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ProductWriteRequestDTO"
      responses:
        "404":
          description: Product not found
        "200":
          description: Product updated successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductDTO"
        "400":
          description: Invalid input data or file processing error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductDTO"
        "401":
          description: Unauthorized user
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductDTO"
        "403":
          description: Forbidden (user is not the owner)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductDTO"
    delete:
      tags:
      - Products
      summary: Delete a product
      description: Deletes a specific product. The requesting user must be the owner.
      operationId: deleteProduct
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: Product not found
        "204":
          description: Product deleted successfully
        "401":
          description: Unauthorized user
        "403":
          description: Forbidden (user is not the owner)
  /api/v1/admin/users/{id}:
    get:
      tags:
      - Admin
      summary: Get user by ID
      description: Retrieves details of a specific user by their ID
      operationId: getUserById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: User not found
        "200":
          description: User retrieved successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserDTO"
    put:
      tags:
      - Admin
      summary: Update user
      description: Updates an existing user's information and profile photo
      operationId: updateUser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/AdminUserUpdateRequestDTO"
      responses:
        "404":
          description: User not found
        "200":
          description: User updated successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserDTO"
        "400":
          description: Invalid input or image processing failed
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserDTO"
    delete:
      tags:
      - Admin
      summary: Delete user
      description: Deletes a user from the system
      operationId: deleteUser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: User not found
        "200":
          description: User deleted successfully
          content:
            '*/*':
              schema:
                type: string
    patch:
      tags:
      - Admin
      summary: Update user ban status
      description: Updates the ban status of a specific user
      operationId: updateUserBanStatus
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserBanRequestDTO"
        required: true
      responses:
        "404":
          description: User not found
        "200":
          description: Ban status updated successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserDTO"
  /api/v1/admin/products/{id}:
    get:
      tags:
      - Admin
      summary: Get product by ID
      description: Retrieves details of a specific product by its ID
      operationId: getProductById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: Product not found
        "200":
          description: Product retrieved successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductDTO"
    put:
      tags:
      - Admin
      summary: Update product
      description: Updates an existing product's details and image
      operationId: updateProduct_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/AdminProductUpdateRequestDTO"
      responses:
        "404":
          description: Product not found
        "200":
          description: Product updated successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductDTO"
        "400":
          description: Invalid input or image processing failed
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductDTO"
    delete:
      tags:
      - Admin
      summary: Delete product
      description: Deletes a product from the inventory
      operationId: deleteProduct_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: Product not found
        "200":
          description: Product deleted successfully
          content:
            '*/*':
              schema:
                type: string
  /api/v1/valorations:
    get:
      tags:
      - Valorations
      summary: Get all valorations
      description: Retrieves a paginated list of all valorations in the system
      operationId: getAllValorations
      parameters:
      - name: pageable
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "404":
          description: Not Found
        "200":
          description: Valorations retrieved successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedResponseValorationDTO"
    post:
      tags:
      - Valorations
      summary: Create a valoration
      description: Submits a new valoration for a completed transaction
      operationId: createValoration
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValorationDTO"
        required: true
      responses:
        "404":
          description: Transaction not found
        "201":
          description: Valoration created successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ValorationDTO"
        "400":
          description: Invalid input data
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ValorationDTO"
        "401":
          description: Unauthorized user
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ValorationDTO"
  /api/v1/users:
    post:
      tags:
      - Users
      summary: Register a new user
      description: Registers a new user in the system. Supports multipart/form-data
        for profile picture uploads.
      operationId: signup
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/SignupRequestDTO"
      responses:
        "404":
          description: Not Found
        "201":
          description: User registered successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserDTO"
        "400":
          description: "Invalid input data (e.g., passwords do not match or file processing\
            \ error)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserDTO"
        "409":
          description: "Conflict (e.g., username or email already exists)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserDTO"
  /api/v1/transactions:
    post:
      tags:
      - Transactions
      summary: Create a transaction
      description: Processes and confirms a new product purchase
      operationId: createTransaction
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionCreateRequestDTO"
        required: true
      responses:
        "404":
          description: Product not found
        "201":
          description: Transaction created successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TransactionDTO"
        "400":
          description: Invalid input data
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TransactionDTO"
        "401":
          description: Unauthorized user
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TransactionDTO"
        "409":
          description: "Conflict (e.g., insufficient balance or product already sold)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TransactionDTO"
  /api/v1/products:
    get:
      tags:
      - Products
      summary: Get global catalog products
      description: "Retrieves a paginated list of products from the global catalog,\
        \ with optional search and category filters"
      operationId: getProducts
      parameters:
      - name: query
        in: query
        required: false
        schema:
          type: string
      - name: category
        in: query
        required: false
        schema:
          type: string
      - name: pageable
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "404":
          description: Not Found
        "200":
          description: Products retrieved successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedResponseProductDTO"
    post:
      tags:
      - Products
      summary: Create a product
      description: Creates a new product for the authenticated user
      operationId: createProduct
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ProductWriteRequestDTO"
      responses:
        "404":
          description: Not Found
        "201":
          description: Product created successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductDTO"
        "400":
          description: Invalid input data or file processing error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductDTO"
        "401":
          description: Unauthorized user
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductDTO"
  /api/v1/products/{productId}/image:
    get:
      tags:
      - Images
      summary: Get product image metadata
      description: Retrieves image metadata for a specific product
      operationId: getProductImage
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: Product or image not found
        "200":
          description: Image metadata retrieved successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ImageDTO"
    post:
      tags:
      - Images
      summary: Replace product image
      description: Uploads a new image for a specific product and replaces the existing
        one
      operationId: replaceProductImage
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      responses:
        "404":
          description: Product not found
        "201":
          description: Image replaced successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductDTO"
        "400":
          description: Invalid input or image processing failed
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductDTO"
        "401":
          description: Unauthorized user
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductDTO"
  /api/v1/inquiries:
    post:
      tags:
      - Inquiries
      summary: Submit inquiry
      description: Submits a new inquiry from a buyer to a seller
      operationId: sendInquiry
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InquiryRequestDTO"
        required: true
      responses:
        "404":
          description: Not Found
        "201":
          description: Inquiry created successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/NotificationResultDTO"
        "400":
          description: Invalid input data
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/NotificationResultDTO"
        "401":
          description: Unauthorized user
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/NotificationResultDTO"
        "409":
          description: "Inquiry could not be created (e.g., cooldown active)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/NotificationResultDTO"
  /api/v1/auth/refresh:
    post:
      tags:
      - Authentication
      summary: Refresh JWT token
      description: Refreshes JWT token using a refresh token from HTTP cookies
      operationId: refresh
      parameters:
      - name: RefreshToken
        in: cookie
        required: false
        schema:
          type: string
      responses:
        "404":
          description: Not Found
        "200":
          description: Token refreshed successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Missing refresh token
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid or expired refresh token
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/v1/auth/logout:
    post:
      tags:
      - Authentication
      summary: User logout
      description: Logs out the current user by invalidating session tokens
      operationId: logout
      responses:
        "404":
          description: Not Found
        "200":
          description: Logged out successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/v1/auth/login:
    post:
      tags:
      - Authentication
      summary: User login
      description: Authenticates user with credentials and returns JWT tokens
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "404":
          description: Not Found
        "200":
          description: Successful authentication
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/v1/admin/products:
    get:
      tags:
      - Admin
      summary: Get all products
      description: Retrieves a paginated list of all products in the inventory
      operationId: getProducts_1
      parameters:
      - name: pageable
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "404":
          description: Not Found
        "200":
          description: Products retrieved successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedResponseProductDTO"
    post:
      tags:
      - Admin
      summary: Create product
      description: Creates a new product as an administrator
      operationId: createProduct_1
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/AdminProductCreateRequestDTO"
      responses:
        "404":
          description: Not Found
        "201":
          description: Product created successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductDTO"
        "400":
          description: Invalid input or image processing failed
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductDTO"
  /api/v1/users/me/profile:
    patch:
      tags:
      - User Profiles
      summary: Update my settings
      description: Updates the settings and profile information of the authenticated
        user
      operationId: updateMySettings
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UserSettingsUpdateDTO"
      responses:
        "404":
          description: Not Found
        "200":
          description: Settings updated successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserDTO"
        "400":
          description: Invalid input data
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserDTO"
        "401":
          description: Unauthorized user
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserDTO"
  /api/v1/users/{id}/profile:
    get:
      tags:
      - User Profiles
      summary: Get seller profile
      description: Retrieves the public profile of a specific seller by their ID
      operationId: getSellerProfile
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
